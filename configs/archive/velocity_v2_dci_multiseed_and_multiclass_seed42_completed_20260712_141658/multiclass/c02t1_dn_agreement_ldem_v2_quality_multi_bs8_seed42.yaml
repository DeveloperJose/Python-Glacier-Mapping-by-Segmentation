# Controlled multiclass velocity v2 interaction test; BG vs CI vs DCI.
training_opts:
  dataset_name: c02t1_dn_agreement_ldem_v2_quality
  run_name: c02t1_dn_agreement_ldem_v2_quality_multi_bs8_seed42
  seed: 42
  augmentation_seed: 1042
  mlflow_experiment_name: sota_replication
  mlflow_artifacts_enabled: false
loader_opts:
  batch_size: 8
  normalize: mean-std
  robust_scaling: false
model_opts:
  framework: smp
  name: Unet
  channels_last: true
  sigma_init: 0.5
  min_log_var: -3.0
  max_log_var: 2.0
  args:
    encoder_name: resnet18
    encoder_weights: null
